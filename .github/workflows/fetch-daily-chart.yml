name: Fetch daily chart data

on:
  schedule:
    # 09:00 UTC daily. The puzzle day rolls over at 3:00 AM US Eastern —
    # that's 07:00 UTC during EDT or 08:00 UTC during EST, so 09:00 UTC
    # is safely after the rollover year-round without needing a seasonal
    # cron change, and comfortably after the prior trading day's close
    # has settled.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's chart data
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/fetch_daily_chart.py

      - name: Commit and push if changed
        run: |
          git config user.name "chartle-bot"
          git config user.email "actions@github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add chart data for $(date -u +%F)"
            git push
          fi
