name: Fetch daily chart data

on:
  schedule:
    # 05:00 UTC daily — after prior trading day's close has settled.
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # allows manual "Run workflow" trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch today's chart data
        run: python scripts/fetch_daily_chart.py

      - name: Commit and push if changed
        run: |
          git config user.name "chartle-bot"
          git config user.email "actions@github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add chart data for $(date -u +%F)"
            git push
          fi
